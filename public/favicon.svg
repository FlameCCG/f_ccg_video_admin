  </defs>
  <rect width="32" height="32" rx="7" fill="url(#brand)" />
  <path
    d="M13.2 10.3 22.4 15.5a0.6 0.6 0 0 1 0 1L13.2 21.7a0.6 0.6 0 0 1-0.9-0.5V10.8a0.6 0.6 0 0 1 0.9-0.5z"
