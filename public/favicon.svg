<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Admin Console">
  <!--
    自绘项目图标：品牌底色圆角方块 + 播放三角（视频后台语义），不引用任何外部资源。
    说明：favicon 是独立静态资源，无法读取 CSS Variables，
